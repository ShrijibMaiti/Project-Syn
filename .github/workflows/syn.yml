name: SYN merge gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  syn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run SYN gate
        # Exit 1 = refused. Exit 2 = gate could not run, which also fails the job:
        # a gate that cannot run must never be read as approval.
        run: |
          python -m gateway.ci_gate \
            --commit "${GITHUB_SHA}" \
            --out syn-certificate.md \
            --json-out syn-verdict.json \
            --summary
      - name: Upload certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syn-certificate
          path: |
            syn-certificate.md
            syn-verdict.json
